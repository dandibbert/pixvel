name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno fmt --check src scripts deno.json

      - run: deno lint src scripts

      - run: deno check src/index.ts

      - run: deno task test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --prefix frontend

      - run: npm --prefix frontend run lint

      - run: npm --prefix frontend run test

      - run: npm --prefix frontend run build

      # frontend/dist is committed because the deploy CLI skips gitignored
      # files, so a stale build would be shipped without anyone noticing.
      - name: Verify committed frontend/dist matches a fresh build
        run: |
          if [ -n "$(git status --porcelain frontend/dist)" ]; then
            git status --short frontend/dist
            echo "::error::frontend/dist is stale. Run 'npm --prefix frontend run build' and commit the result."
            exit 1
          fi
          echo "frontend/dist matches the committed sources."
