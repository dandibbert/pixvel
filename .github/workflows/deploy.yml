name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_checks:
        description: Deploy without running CI first (emergency hotfixes only)
        type: boolean
        default: false

permissions:
  contents: read

# Never let two deploys race for the production revision.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ !inputs.skip_checks }}
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Deno Deploy
    needs: verify
    if: ${{ always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
      # The org, app and URL are not credentials, so they belong in Variables —
      # but Secrets is an easy place to land on, and reading both means the
      # deploy works either way.
      DENO_DEPLOY_ORG: ${{ vars.DENO_DEPLOY_ORG || secrets.DENO_DEPLOY_ORG }}
      DENO_DEPLOY_APP: ${{ vars.DENO_DEPLOY_APP || secrets.DENO_DEPLOY_APP }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL || secrets.DEPLOY_URL }}
      BUILD_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Require the deploy credentials and target
        run: |
          missing=()
          for name in DENO_DEPLOY_TOKEN DENO_DEPLOY_ORG DENO_DEPLOY_APP; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing: ${missing[*]}. Add them under Settings -> Secrets and variables -> Actions. DENO_DEPLOY_TOKEN belongs on the Secrets tab; DENO_DEPLOY_ORG and DENO_DEPLOY_APP belong on the Variables tab (both tabs are read, but repository scope is required, not an environment)."
            exit 1
          fi

      # The CI job proved the committed frontend/dist matches its sources, so
      # the checkout is uploaded as-is: the deployed tree stays reproducible
      # from this commit and `deno task deploy:check` can confirm it.
      - name: Record build metadata
        run: deno task build-info

      - name: Deploy
        env:
          DEPLOY_RESULT_PATH: ${{ runner.temp }}/deploy-result.json
        run: bash scripts/publish.sh

      # Uploading a revision and putting it in front of users are two different
      # things: when no production domain serves the revision, the deploy still
      # succeeds and the site keeps running the previous code.
      - name: Resolve where the revision went live
        run: |
          result="${{ runner.temp }}/deploy-result.json"
          production_url="$(jq -r '.productionUrl // empty' "$result")"

          echo "Domains reported for this revision:"
          jq -r '.timelines[]? | "  \(.partition): \(if (.domains | length) == 0 then "(none)" else (.domains | join(", ")) end)"' "$result"

          if [ -n "$DEPLOY_URL" ]; then
            verify_url="$DEPLOY_URL"
          elif [ -n "$production_url" ]; then
            verify_url="$production_url"
          else
            # Deno Deploy always serves an app at this hostname, so the check
            # below still has a target and can report what the site really runs.
            verify_url="https://${DENO_DEPLOY_APP}.${DENO_DEPLOY_ORG}.deno.net"
            echo "::warning::No production domain points at this revision, so it is not the active revision on the Production timeline. Checking ${verify_url} anyway."
          fi

          echo "VERIFY_URL=$verify_url" >> "$GITHUB_ENV"

      - name: Verify the deployment serves this revision
        run: |
          for attempt in 1 2 3 4 5; do
            if deno task deploy:check "$VERIFY_URL"; then
              exit 0
            fi
            echo "Deployment not live yet (attempt $attempt); retrying in 15s"
            sleep 15
          done
          echo "::error::$VERIFY_URL still serves older code. The upload succeeded, so the revision exists but never became the active revision of the timeline that owns this domain: in the Deno Deploy dashboard open the app, go to Timelines -> Production, and unlock it (or lock it to this revision)."
          exit 1

      - name: Summarize the deployment
        if: ${{ always() }}
        run: |
          {
            echo "### Deployed revision"
            echo
            echo '```json'
            cat build-info.json
            echo '```'
            echo
            if [ -n "${VERIFY_URL:-}" ]; then
              echo "Checked against ${VERIFY_URL}/api/version."
            else
              echo "The upload never finished, so nothing was checked."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
